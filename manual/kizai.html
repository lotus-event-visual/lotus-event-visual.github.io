<!doctype html>
<html lang="ja">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOTUS VISUAL 機材マニュアル v2 試作</title>
<style>
:root{--bg:#f4f5f6;--panel:#fff;--ink:#16191d;--sub:#59616b;--line:#d9dde2;--chip:#e9ecef;--acc:#0b6b5c;--acc-ink:#fff;--warn-bg:#fff3d6;--warn-ink:#7a4b00;--thumb:#eceef0;--band:#1c1f24;--shadow:0 8px 30px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#101215;--panel:#191c20;--ink:#eef0f2;--sub:#a3acb6;--line:#2c3138;--chip:#23272d;--acc:#4fc3ae;--acc-ink:#06231e;--warn-bg:#3d2f0c;--warn-ink:#ffd27a;--thumb:#eceef0;--band:#1c1f24;--shadow:0 8px 30px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.6;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.head{display:flex;gap:12px;align-items:center;padding:10px 16px}
.brand{font-weight:800;letter-spacing:.04em;font-size:14px;white-space:nowrap}
.brand small{display:block;font-weight:500;color:var(--sub);font-size:11px;letter-spacing:0}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;height:46px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);padding:0 44px 0 14px;font-size:16px}
.search button{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;border-radius:8px;background:var(--chip);display:none}
.search.has button{display:block}
h2.sec{font-size:12px;color:var(--sub);font-weight:700;margin:16px 0 8px;letter-spacing:.06em}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tasks button{min-height:46px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;line-height:1.35}
.tasks button[aria-pressed=true],.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-top:14px;scrollbar-width:thin}
.tabs button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap;min-height:40px}
.tabs b{font-weight:500;opacity:.7;margin-left:4px}
.bar{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;margin:6px 0 12px;font-size:13px;color:var(--sub)}
.bar strong{color:var(--ink);font-size:15px}
.bar label{display:inline-flex;gap:6px;align-items:center;min-height:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-bottom:60px}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}}
.card{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;min-width:0}
.card:hover{border-color:var(--ink)}
.ph{aspect-ratio:4/3;background:var(--thumb);display:block;width:100%;height:auto}
.noph{aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--chip) 0 10px,transparent 10px 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:12px;border-bottom:1px solid var(--line)}
.noph b{font-size:15px;color:var(--ink)}
.cc{padding:9px 11px 11px;min-width:0}
.mk{display:block;font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.03em}
.md{display:block;font-weight:800;font-size:14.5px;line-height:1.3}
.rl{font-size:12px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin:5px 4px 0 0;background:var(--chip);color:var(--sub)}
.q{background:var(--warn-bg);color:var(--warn-ink)}
.empty{padding:40px 0;text-align:center;color:var(--sub)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.ov.on{display:block}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--panel);box-shadow:var(--shadow);overflow-y:auto;overscroll-behavior:contain}
.sh{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 14px;z-index:1}
.sh div{flex:1;min-width:0}
.sh .md{font-size:17px}
.x{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:20px}
.sb{padding:14px}
.sb img.ph,.sb .noph{border-radius:10px;max-width:420px;margin:0 auto 14px}
.key{border:2px solid var(--ink);border-radius:12px;margin:0 0 6px;overflow:hidden}
.key div{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.key div:first-child{border-top:0}
.key dt{font-size:12px;font-weight:800;color:var(--sub);padding-top:2px}
.key dd{margin:0;font-weight:600;font-size:14.5px;min-width:0}
.key .warnrow{background:var(--warn-bg)}
.key .warnrow dt,.key .warnrow dd{color:var(--warn-ink)}
h3{font-size:13px;margin:22px 0 8px;padding-left:9px;border-left:4px solid var(--acc);letter-spacing:.04em}
h3 small{font-weight:500;color:var(--sub);margin-left:6px}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.flow li{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600;background:var(--bg);position:relative}
.flow li+li{margin-top:22px}
.flow li+li:before{content:"↓";position:absolute;top:-22px;left:50%;transform:translateX(-50%);color:var(--sub);font-weight:800}
.flow li b{color:var(--acc);margin-right:8px}
ol.steps,ul.steps{margin:0;padding-left:1.4em}
.steps li{margin:4px 0}
.chk{margin:0;padding:0;list-style:none}
.chk li{padding:8px 0;border-top:1px solid var(--line)}
.chk b{display:block}
table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-top:1px solid var(--line)}
th{width:34%;color:var(--sub);font-weight:700}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rel button{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;font-size:12px;font-weight:700;min-width:0}
.rel span{padding:6px 8px;line-height:1.3}
.meta{font-size:12.5px;color:var(--sub)}
.meta a{color:var(--acc)}
.qv{background:var(--warn-bg);color:var(--warn-ink);border-radius:5px;padding:0 6px;font-weight:700;font-size:.92em;white-space:nowrap}
footer{color:var(--sub);font-size:12px;padding:0 0 30px}
@media (max-width:699px){.tasks{display:flex;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.tasks button{flex:none;white-space:nowrap;min-height:42px}}
</style>
</head>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="550" viewBox="0 0 360 550" role="img" aria-labelledby="t d"><title id="t">DDA-25HD/SD 分配の説明図</title><desc id="d">1つのSDI映像を最大8出力へ分けます。解像度は変換しません。実機写真や端子配置図ではありません。</desc><rect width="360" height="550" rx="18" fill="#0c1827"/><g font-family="sans-serif" text-anchor="middle" fill="white"><text x="180" y="39" font-size="22" font-weight="bold">同じ映像を、複数箇所へ</text><text x="180" y="70" font-size="16" fill="#b8c7d7">DDA-25HD/SD｜信号の流れ</text><rect x="70" y="99" width="220" height="60" rx="12" fill="#1c3549" stroke="#86d9c4"/><text x="180" y="136" font-size="20">SDI映像 1入力</text><path d="M180 160v31m-8-9 8 12 8-12" fill="none" stroke="#86d9c4" stroke-width="3"/><rect x="30" y="204" width="300" height="85" rx="12" fill="#126c63"/><text x="180" y="239" font-size="22" font-weight="bold">分配・リクロック</text><text x="180" y="269" font-size="17">解像度は変換しません</text><path d="M180 290v30M50 320h260M50 320v23M135 320v23M225 320v23M310 320v23" fill="none" stroke="#86d9c4" stroke-width="3"/><rect x="15" y="343" width="70" height="45" rx="8" fill="#1c3549" stroke="#86d9c4"/><text x="50" y="372" font-size="17">OUT1</text><rect x="100" y="343" width="70" height="45" rx="8" fill="#1c3549" stroke="#86d9c4"/><text x="135" y="372" font-size="17">OUT2</text><rect x="190" y="343" width="70" height="45" rx="8" fill="#1c3549" stroke="#86d9c4"/><text x="225" y="372" font-size="17">…</text><rect x="275" y="343" width="70" height="45" rx="8" fill="#1c3549" stroke="#86d9c4"/><text x="310" y="372" font-size="17">OUT8</text><text x="180" y="421" font-size="18">同じ映像を最大8出力へ</text><text x="180" y="450" font-size="16" fill="#b8c7d7">送り先もSDI対応が必要です</text><text x="180" y="489" font-size="16" fill="#f5cb8c">本番中はパッチ盤を抜き差ししません</text><text x="180" y="516" font-size="14" fill="#b8c7d7">独自の説明図。</text><text x="180" y="539" font-size="14" fill="#b8c7d7">実機写真・端子配置図ではありません。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="t d"><title id="t">同じ映像を4画面へ</title><desc id="d">PCなど1系統の映像を分配器で4つに分け、同じ資料を表示する役割図。実際の配線図ではありません。</desc><rect width="640" height="560" rx="20" fill="#edf1e8"/><g font-family="sans-serif" text-anchor="middle" fill="#27443b"><text x="320" y="49" font-size="28">1つの映像を、4画面へ</text><rect x="210" y="78" width="220" height="68" rx="8" fill="#fff" stroke="#769386"/><text x="320" y="120" font-size="25">PCなどの送信元</text><path d="M320 148V185" stroke="#567a68" stroke-width="3"/><path d="m313 175 7 10 7-10" fill="none" stroke="#567a68" stroke-width="3"/><rect x="180" y="188" width="280" height="75" rx="8" fill="#284f43"/><text x="320" y="220" font-size="24" fill="#fff">DVH-14A</text><text x="320" y="247" font-size="20" fill="#e7eedd">1入力 → 4分配</text><path d="M320 264V292M90 292H550M90 292V331M243 292V331M397 292V331M550 292V331" fill="none" stroke="#567a68" stroke-width="3"/>
<g fill="#fff" stroke="#769386" stroke-width="2"><rect x="20" y="332" width="140" height="112" rx="6"/><rect x="173" y="332" width="140" height="112" rx="6"/><rect x="327" y="332" width="140" height="112" rx="6"/><rect x="480" y="332" width="140" height="112" rx="6"/></g><g font-size="23"><text x="90" y="378">同じ資料</text><text x="243" y="378">同じ資料</text><text x="397" y="378">同じ資料</text><text x="550" y="378">同じ資料</text></g><g font-size="20" fill="#67786b"><text x="90" y="415">画面1</text><text x="243" y="415">画面2</text><text x="397" y="415">画面3</text><text x="550" y="415">画面4</text></g><text x="320" y="496" font-size="22">別々の映像をつくる機器ではありません。</text><text x="320" y="532" font-size="18" fill="#5a6f61">役割の説明図／端子・配線は構成ごとに確認</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650"><rect width="360" height="650" rx="18" fill="#f3f6f9"/><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#18334a}.h{font-size:19px;font-weight:700}.t{font-size:14px}.s{font-size:12px}.n{font-size:16px;font-weight:700;fill:#087e8b}</style><text x="20" y="34" class="h">LCD1015S｜確認を分ける</text><rect x="16" y="78" width="328" height="143" rx="12" fill="white"/><text x="30" y="106" class="n">映像：SDIだけを中継する</text><text x="30" y="138" class="t">SDI IN → 本機の表示</text><text x="30" y="165" class="t">同じSDI IN → SDI OUT → 後段の機器</text><text x="30" y="198" class="t">HDMI入力をSDIへ変換する機能はありません。</text><rect x="16" y="236" width="328" height="132" rx="12" fill="white"/><text x="30" y="264" class="n">画面：全体と細部を見る</text><text x="30" y="294" class="t">液晶は1280×800画素。フルHD入力は</text><text x="30" y="319" class="t">全体表示では縮小されます。四隅と文字を</text><text x="30" y="344" class="t">点検し、細部を見るときだけ等倍表示へ。</text><rect x="16" y="383" width="328" height="132" rx="12" fill="#dff2f1"/><text x="30" y="411" class="n">音声：Rだけで左右を判断しない</text><text x="30" y="441" class="t">内蔵スピーカーはモノラル・Rのみ。</text><text x="30" y="466" class="t">L/Rの正常は、担当者が指定した</text><text x="30" y="491" class="t">ステレオの確認系統で別々に試験します。</text><rect x="16" y="530" width="328" height="72" rx="12" fill="white"/><text x="30" y="558" class="t">3GはLevel Aのみ。Level Bは対応外。</text><text x="30" y="584" class="t">後段につなぐ場合は、後段の表示も点検。</text><text x="20" y="630" class="s">電源断・再起動などの症状は、使用前に担当者へ。</text></svg>
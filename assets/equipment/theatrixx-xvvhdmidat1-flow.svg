<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="760" height="570" rx="18" fill="#091721"/><g font-family="sans-serif" fill="#ecf6fb"><text x="36" y="52" font-size="27">Theatrixx XVVHDMIDAT1</text><text x="36" y="84" font-size="16" fill="#a9c0cf">HDMI 1 本を 4 本に分ける</text><text x="36" y="150" font-size="15" fill="#51d0c2">入力</text><rect x="36" y="200" width="190" height="56" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="131" y="226" font-size="15" text-anchor="middle">HDMI 2.0 × 1</text><text x="131" y="246" font-size="12" text-anchor="middle" fill="#a9c0cf">ロック付き端子</text><path d="M226 228H290" stroke="#51d0c2" stroke-width="2"/><rect x="290" y="176" width="160" height="104" rx="10" fill="#1f3a4c" stroke="#ecf6fb" stroke-width="2"/><text x="370" y="222" font-size="19" text-anchor="middle">分配器</text><text x="370" y="248" font-size="13" text-anchor="middle" fill="#a9c0cf">1 入力 → 4 出力</text><text x="500" y="150" font-size="15" fill="#51d0c2">出力(ポートごとに縮小可)</text><path d="M450 228L500 176" stroke="#51d0c2" stroke-width="1.5"/><rect x="500" y="164" width="220" height="24" rx="5" fill="#172d3c" stroke="#51d0c2"/><text x="610" y="181" font-size="13" text-anchor="middle">HDMI 2.0 出力 1</text><path d="M450 228L500 206" stroke="#51d0c2" stroke-width="1.5"/><rect x="500" y="194" width="220" height="24" rx="5" fill="#172d3c" stroke="#51d0c2"/><text x="610" y="211" font-size="13" text-anchor="middle">HDMI 2.0 出力 2</text><path d="M450 228L500 236" stroke="#51d0c2" stroke-width="1.5"/><rect x="500" y="224" width="220" height="24" rx="5" fill="#172d3c" stroke="#51d0c2"/><text x="610" y="241" font-size="13" text-anchor="middle">HDMI 2.0 出力 3</text><path d="M450 228L500 266" stroke="#51d0c2" stroke-width="1.5"/><rect x="500" y="254" width="220" height="24" rx="5" fill="#172d3c" stroke="#51d0c2"/><text x="610" y="271" font-size="13" text-anchor="middle">HDMI 2.0 出力 4</text><text x="36" y="340" font-size="15" fill="#51d0c2">電源</text><rect x="36" y="354" width="300" height="40" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="186" y="380" font-size="14" text-anchor="middle">powerCON TRUE1 入力 → 送り出し</text><text x="36" y="440" font-size="15" fill="#a9c0cf">4K/2K 60fps、HDCP 2.2/1.4 対応。</text><text x="36" y="466" font-size="15" fill="#a9c0cf">送り先の画面ごとに、解像度と HDCP の扱いを確認します。</text><text x="36" y="536" font-size="13" fill="#6f8796">出典：Theatrixx XVVHDMIDAT1 製品資料(2026年11月9日照合)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-labelledby="title desc"><title id="title">画面幅と投写距離</title><desc id="desc">上から見た配置の説明図。画面の幅と、レンズ前端から画面までの距離は別に測ります。寸法や実機構造を示す図ではありません。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e7eee8"/><stop offset="1" stop-color="#f6f3eb"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2d5148"/></marker></defs><rect width="700" height="500" rx="20" fill="url(#bg)"/><g font-family="sans-serif" fill="#24443b"><text x="30" y="48" font-size="30">上から見た配置 / 説明図</text><path d="M205 240 550 120 550 350Z" fill="#bfd3c5" opacity=".7"/><rect x="70" y="200" width="110" height="80" rx="10" fill="#314b43"/><rect x="180" y="220" width="25" height="40" rx="4" fill="#5a776b"/><line x1="550" y1="120" x2="550" y2="350" stroke="#315346" stroke-width="10"/><text x="35" y="165" font-size="28">プロジェクター</text><text x="455" y="92" font-size="30">スクリーン</text><path d="M205 285V430 M550 360V430" stroke="#779b88" stroke-width="2" stroke-dasharray="7 6"/><line x1="218" y1="410" x2="537" y2="410" stroke="#2d5148" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="377" y="465" font-size="36" text-anchor="middle">投写距離</text><line x1="625" y1="135" x2="625" y2="335" stroke="#2d5148" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="625" y="385" font-size="32" text-anchor="middle">画面幅</text><circle cx="205" cy="240" r="7" fill="#2d5148"/><text x="205" y="330" font-size="30" text-anchor="middle">レンズ前端</text></g></svg>

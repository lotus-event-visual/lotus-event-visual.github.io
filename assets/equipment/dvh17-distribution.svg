<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620"><rect width="360" height="620" rx="20" fill="#f2f6fa"/><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#183246;font-size:14px}.title{font-size:21px;font-weight:700}.small{font-size:12px}.box{fill:white;stroke:#b4c8d7;stroke-width:1.5}</style><text x="22" y="35" class="title">同じ映像を7箇所へ</text><text x="22" y="58">IMAGENICS DVH-17A</text><rect class="box" x="70" y="80" width="220" height="48" rx="10"/><text x="180" y="110" text-anchor="middle">PCなど：映像1系統</text><path d="M180 128V155" stroke="#176d8c" stroke-width="3"/><path d="M174 149L180 157L186 149" fill="none" stroke="#176d8c" stroke-width="3"/><rect x="40" y="160" width="280" height="66" rx="12" fill="#d5edf5"/><text x="180" y="187" text-anchor="middle">DVH-17A</text><text x="180" y="209" text-anchor="middle">DVI-Dで入力・7系統へ分配</text><path d="M180 226V246H28V263M180 246H332V263" fill="none" stroke="#176d8c" stroke-width="2"/>
<path d="M28.0 246V263" stroke="#176d8c" stroke-width="2"/><rect x="9.0" y="263" width="38" height="38" rx="6" class="box"/><text x="28.0" y="287" text-anchor="middle">1</text><path d="M78.66666666666666 246V263" stroke="#176d8c" stroke-width="2"/><rect x="59.66666666666666" y="263" width="38" height="38" rx="6" class="box"/><text x="78.66666666666666" y="287" text-anchor="middle">2</text><path d="M129.33333333333331 246V263" stroke="#176d8c" stroke-width="2"/><rect x="110.33333333333331" y="263" width="38" height="38" rx="6" class="box"/><text x="129.33333333333331" y="287" text-anchor="middle">3</text><path d="M180.0 246V263" stroke="#176d8c" stroke-width="2"/><rect x="161.0" y="263" width="38" height="38" rx="6" class="box"/><text x="180.0" y="287" text-anchor="middle">4</text><path d="M230.66666666666666 246V263" stroke="#176d8c" stroke-width="2"/><rect x="211.66666666666666" y="263" width="38" height="38" rx="6" class="box"/><text x="230.66666666666666" y="287" text-anchor="middle">5</text><path d="M281.3333333333333 246V263" stroke="#176d8c" stroke-width="2"/><rect x="262.3333333333333" y="263" width="38" height="38" rx="6" class="box"/><text x="281.3333333333333" y="287" text-anchor="middle">6</text><path d="M332.0 246V263" stroke="#176d8c" stroke-width="2"/><rect x="313.0" y="263" width="38" height="38" rx="6" class="box"/><text x="332.0" y="287" text-anchor="middle">7</text><text x="180" y="325" text-anchor="middle">OUT1〜7 → 使用する全画面で試験</text><rect class="box" x="22" y="347" width="316" height="113" rx="12"/><text x="38" y="373" font-weight="700">EDIDは「受けられる映像」の情報</text><text x="38" y="398">OUT1からコピーしても、ほかの画面が</text><text x="38" y="420">同じ映像を受けられるとは限りません。</text><text x="38" y="443">全表示先に共通する形式を選びます。</text><text x="22" y="490">HDMI接続には対応する変換部品を用意。</text><text x="22" y="514">配線の抜き差しは接続機器も電源OFF。</text><text x="22" y="538">本番中のEDID変更・初期化はしません。</text><text x="22" y="576" class="small">独自の説明図。実機写真・端子配置図ではありません。</text><text x="22" y="596" class="small">分配器は、出力先ごとの解像度変換を行いません。</text></svg>
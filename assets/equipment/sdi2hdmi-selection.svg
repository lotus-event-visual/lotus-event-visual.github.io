<svg xmlns="http://www.w3.org/2000/svg" width="360" height="690" viewBox="0 0 360 690"><rect width="360" height="690" rx="18" fill="#f3f6f9"/><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#18334a}.h{font-size:19px;font-weight:700}.t{font-size:14px}.s{font-size:12px}.n{font-size:16px;font-weight:700;fill:#087e8b}</style><text x="20" y="33" class="h">SDI → HDMI を選ぶ前に</text><text x="20" y="58" class="s">XVVSDI2HDMI</text>
<rect x="16" y="78" width="328" height="133" rx="12" fill="white"/><text x="30" y="105" class="n">1　変換する方向</text><text x="30" y="136" class="t">送り元：SDI OUT → 本機 → HDMI画面</text><text x="30" y="162" class="t">HDMI入力をSDIへ変える機器ではありません。</text><text x="30" y="188" class="t">SDI出力2系統は、同じ入力映像の中継です。</text>
<rect x="16" y="225" width="328" height="133" rx="12" fill="white"/><text x="30" y="252" class="n">2　送り元と画面の形式</text><text x="30" y="283" class="t">3G・HD・SD-SDIの対応形式を照合。</text><text x="30" y="309" class="t">3Gは1080p50／59.94／60に対応。</text><text x="30" y="335" class="t">自動判別でも、画面側の対応確認は必要です。</text>
<rect x="16" y="372" width="328" height="133" rx="12" fill="white"/><text x="30" y="399" class="n">3　末尾まで型式を照合</text><text x="30" y="430" class="t">XVVSDI2HDMI：powerCON入力モデル。</text><text x="30" y="456" class="t">末尾T1／12Gは別型式として選びます。</text><text x="30" y="482" class="t">電源担当者が実機銘板と供給電圧を照合。</text>
<rect x="16" y="519" width="328" height="119" rx="12" fill="#dff2f1"/><text x="30" y="546" class="n">試験系統で、出力先ごとに確認</text><text x="30" y="577" class="t">HDMI画面と使用するSDI中継先の</text><text x="30" y="603" class="t">映像・音声が安定したら接続内容を記録。</text><text x="20" y="667" class="s">途切れ・音声欠落があれば本番接続を止め、担当者へ。</text></svg>
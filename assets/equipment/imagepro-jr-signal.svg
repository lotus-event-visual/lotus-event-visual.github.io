<svg xmlns="http://www.w3.org/2000/svg" width="360" height="610" viewBox="0 0 360 610"><rect width="360" height="610" rx="20" fill="#f3f7fb"/><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#193347;font-size:14px}.t{font-size:21px;font-weight:700}.s{font-size:12px}.b{fill:white;stroke:#b3c9d8;stroke-width:1.5}.a{fill:none;stroke:#157b9c;stroke-width:3}</style><text class="t" x="22" y="36">映像を、表示先に合わせる</text><text x="22" y="61">Barco ImagePRO-II Jr</text><rect class="b" x="22" y="85" width="316" height="73" rx="10"/><text x="180" y="113" text-anchor="middle">入力機器：PC・再生機など</text><text x="180" y="139" text-anchor="middle">DVI ／ アナログRGB ／ SDI</text><path class="a" d="M180 158V189M174 181L180 189L186 181"/><rect x="22" y="195" width="316" height="88" rx="12" fill="#d3edf5"/><text x="180" y="225" text-anchor="middle">ImagePRO-II Jr</text><text x="180" y="250" text-anchor="middle">使用する入力を選び、</text><text x="180" y="272" text-anchor="middle">出力形式・画面の大きさや位置を調整</text><path class="a" d="M180 283V314M174 306L180 314L186 306"/><rect class="b" x="22" y="320" width="316" height="73" rx="10"/><text x="180" y="349" text-anchor="middle">対応する表示機器・LEDプロセッサー</text><text x="180" y="375" text-anchor="middle">実際の素材で、映像と画面全体を試験</text><text x="22" y="428" font-weight="700">JrにはHDMI・DisplayPort端子なし</text><text x="22" y="455">端子名だけでなく、映像形式も合わせます。</text><text x="22" y="482">映像の確認と、音声の確認は別々に。</text><text x="22" y="509">本番中の初期化・設定復元はしません。</text><text class="s" x="22" y="555">独自の説明図。実機写真・端子配置図ではありません。</text><text class="s" x="22" y="578">すべての出力端子の同時動作を保証する図ではありません。</text></svg>
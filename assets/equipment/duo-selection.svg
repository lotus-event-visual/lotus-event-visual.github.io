<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700"><rect width="360" height="700" rx="20" fill="#f3f7fb"/><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#193347;font-size:14px}.t{font-size:21px;font-weight:700}.s{font-size:12px}.b{fill:white;stroke:#b3c9d8;stroke-width:1.5}</style><text class="t" x="22" y="37">DUOは型式まで合わせる</text><text x="22" y="63">光配線を手配する前の確認順</text><rect class="b" x="22" y="87" width="316" height="84" rx="10"/><text x="38" y="114" font-weight="700">1　接続機器の条件</text><text x="38" y="139">光モジュール・端子・光の種類</text><text x="38" y="161">指定が合うか、担当者が照合</text><rect x="22" y="190" width="316" height="60" rx="10" fill="#d3edf5"/><text x="180" y="215" text-anchor="middle">今回の2系列：2芯・SM・PC</text><text x="180" y="238" text-anchor="middle">掲載型式はシングルモード・PC</text><rect class="b" x="22" y="269" width="150" height="88" rx="10"/><rect class="b" x="188" y="269" width="150" height="88" rx="10"/><text x="97" y="296" text-anchor="middle" font-weight="700">NKO2S</text><text x="97" y="323" text-anchor="middle">標準系列</text><text x="263" y="296" text-anchor="middle" font-weight="700">NKOX2S</text><text x="263" y="323" text-anchor="middle">X-TREME</text><text x="263" y="346" text-anchor="middle">二重被覆</text><rect class="b" x="22" y="377" width="316" height="84" rx="10"/><text x="38" y="405" font-weight="700">2　経路から長さを選ぶ</text><text x="38" y="430">50m ／ 100m ＋ 中継部品の有無</text><text x="38" y="452">ケーブル長＝通信保証距離ではありません。</text><rect class="b" x="22" y="480" width="316" height="84" rx="10"/><text x="38" y="508" font-weight="700">3　光伝送担当者が試験</text><text x="38" y="534">光出力停止 → 接続 → リンクと信号確認</text><text x="38" y="555">端面は、肉眼・拡大鏡でのぞきません。</text><text x="22" y="599">SMとMM、PCとAPC、DUOとQUADを</text><text x="22" y="622">名前や外観だけで置き換えない。</text><text x="22" y="658" class="s">独自の説明図。実機写真・端面図ではありません。</text><text x="22" y="680" class="s">2芯は、映像の本数や給電回路数ではありません。</text></svg>
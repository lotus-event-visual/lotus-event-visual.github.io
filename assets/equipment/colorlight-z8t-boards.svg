<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="760" height="570" rx="18" fill="#091721"/><g font-family="sans-serif" fill="#ecf6fb"><text x="36" y="52" font-size="27">Colorlight Z8t</text><text x="36" y="84" font-size="16" fill="#a9c0cf">入力ボードと出力ボードの組み合わせ · 実機写真ではありません</text><text x="36" y="128" font-size="15" fill="#51d0c2">入力ボード(最大 2 枚)</text><g font-size="15"><rect x="36" y="142" width="250" height="40" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="161" y="168" text-anchor="middle">HDMI 2.0 × 2</text><rect x="36" y="190" width="250" height="40" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="161" y="216" text-anchor="middle">DisplayPort 1.2 × 2</text><rect x="36" y="238" width="250" height="40" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="161" y="264" text-anchor="middle">12G-SDI × 2</text><rect x="36" y="286" width="250" height="40" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="161" y="312" text-anchor="middle">HDMI 2.1・DP 1.4・12G-SDI</text><rect x="36" y="334" width="250" height="40" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="161" y="360" text-anchor="middle">ST 2110(SFP28)</text></g><path d="M290 258H330" stroke="#51d0c2" stroke-width="2"/><rect x="330" y="206" width="120" height="104" rx="10" fill="#1f3a4c" stroke="#ecf6fb" stroke-width="2"/><text x="390" y="250" font-size="19" text-anchor="middle">本体</text><text x="390" y="276" font-size="13" text-anchor="middle" fill="#a9c0cf">4 レイヤー</text><path d="M450 258H490" stroke="#51d0c2" stroke-width="2"/><text x="490" y="128" font-size="15" fill="#51d0c2">出力ボード(最大 2 枚・同じ種類)</text><g font-size="15"><rect x="490" y="190" width="236" height="40" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="608" y="216" text-anchor="middle">5G Ethernet × 4</text><rect x="490" y="238" width="236" height="40" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="608" y="264" text-a
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="760" height="570" rx="18" fill="#091721"/><g font-family="sans-serif" fill="#ecf6fb"><text x="36" y="52" font-size="27">Colorlight H10FN</text><text x="36" y="84" font-size="16" fill="#a9c0cf">光 1 系統と銅線 10 系統をつなぐ · 実機写真ではありません</text>

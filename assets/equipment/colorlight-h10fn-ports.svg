<g font-size="13"><rect x="500" y="132" width="200" height="18" rx="4" fill="#172d3c" stroke="#51d0c2"/><text x="600" y="145" text-anchor="middle">PORT 1 → LED の列へ</text><rect x="500" y="154" width="200" height="18" rx="4" fill="#172d3c" stroke="#51d0c2"/><text x="600" y="167" text-anchor="middle">PORT 2 → LED の列へ</text><rect x="500" y="176" width="200" height="18" rx="4" fill="#172d3c" stroke="#51d0c2"/><text x="600" y="189" text-anchor="middle">PORT 3 → LED の列へ</text><rect x="500" y="198" width="200" height="18" rx="4" fill="#172d3c" stroke="#51d0c2"/><text x="600" y="211" text-anchor="middle">PORT 4 → LED の列へ</text><rect x="500" y="220" width="200" height="18" rx="4" fill="#172d3c" stroke="#51d0c2"/><text x="600" y="233" text-anchor="middle">PORT 5 → LED の列へ</text><rect x="500" y="242" width="200" height="18" rx="4" fill="#172d3c" stroke="#51d0c2"/><text x="600" y="255" text-anchor="middle">PORT 6 → LED の列へ</text><rect x="500" y="264" width="200" height="18" rx="4" fill="#172d3c" stroke="#51d0c2"/><text x="600" y="277" text-anchor="middle">PORT 7 → LED の列へ</text><rect x="500" y="286" width="200" height="18" rx="4" fill="#172d3c" stroke="#51d0c2"/><text x="600" y="299" text-anchor="middle">PORT 8 → LED の列へ</text><rect x="500" y="308" width="200" height="18" rx="4" fill="#172d3c" stroke="#51d0c2"/><text x="600" y="321" text-anchor="middle">PORT 9 → LED の列へ</text><rect x="500" y="330" width="200" height="18" rx="4" fill="#172d3c" stroke="#51d0c2"/><text x="600" y="343" text-anchor="middle">PORT 10 → LED の列へ</text></g><text x="36" y="410" font-size="15" fill="#a9c0cf">操作席から離れた LED の近くで、光の 1 本を銅線の 10 本に分けます。</text><text x="36" y="438" font-size="15" fill="#a9c0cf">各ポートの行き先は、案件ごとの配線計画で決めます。</text><text x="36" y="466" font-size="15" fill="#a9c0cf">H10FN2 とは別の型式です。</text><text x="36" y="536" font-size="13" fill="#6f8796">出典：製品取扱元 H10FN 製品ページ(2026年11月9日照合)</text></g></svg>
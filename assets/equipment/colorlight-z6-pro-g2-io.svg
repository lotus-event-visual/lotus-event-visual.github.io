<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="760" height="570" rx="18" fill="#091721"/><g font-family="sans-serif" fill="#ecf6fb"><text x="36" y="52" font-size="27">Colorlight Z6 PRO-G2</text><text x="36" y="84" font-size="16" fill="#a9c0cf">LED プロセッサー · 実機写真ではありません</text><rect x="36" y="130" width="688" height="44" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="56" y="158" font-size="15" fill="#51d0c2">映像入力</text><text x="250" y="158" font-size="16">4K 入力スロット ×4(HDMI 2.0・DP 1.2・12G-SDI)</text><rect x="36" y="184" width="688" height="44" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="56" y="212" font-size="15" fill="#51d0c2">出力</text><text x="250" y="212" font-size="16">10G 光 ×4(主 2・予備 2)</text><rect x="36" y="238" width="688" height="44" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="56" y="266" font-size="15" fill="#51d0c2">画面の広さ</text><text x="250" y="266" font-size="16">最大 横 8192・縦 8192 ピクセル</text><rect x="36" y="292" width="688" height="44" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="56" y="320" font-size="15" fill="#51d0c2">ウィンドウ</text><text x="250" y="320" font-size="16">最大 4 画面</text><rect x="36" y="346" width="688" height="44" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="56" y="374" font-size="15" fill="#51d0c2">同期</text><text x="250" y="374" font-size="16">Genlock(Bi-level / Tri-level)</text><text x="36" y="430" font-size="15" fill="#a9c0cf">光の出力を、光変換器で LED 側の配線に分けて使います。</text><text x="36" y="456" font-size="15" fill="#a9c0cf">載せる入力カードで、使える端子が変わります。</text><text x="36" y="536" font-size="13" fill="#6f8796">出典：Colorlight Z6 PRO-G2 Specification(2026年11月9日照合)</text></g></svg>
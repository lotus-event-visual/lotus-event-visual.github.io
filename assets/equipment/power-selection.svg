<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 950" role="img" aria-labelledby="title desc"><title id="title">電源機材の相談で確認すること</title><desc id="desc">会場の電源条件と使用機材から、単相20kVA、三相44kVA、単相1.4kVAの絶縁トランスと電源BOXを選定する説明図。</desc><rect width="360" height="950" fill="#f0eee7"/><g font-family="sans-serif" fill="#193b37"><text x="24" y="40" font-size="18" font-weight="700">電源も、会場と機材に合わせて。</text><rect x="20" y="64" width="320" height="124" rx="12" fill="#193b37"/><g fill="#fff" font-size="18"><text x="36" y="98">会場側の電源条件</text><text x="36" y="128">＋ 使用する機材</text><text x="36" y="160">日程・設置場所・担当範囲</text></g><text x="24" y="224" font-size="18">実機の銘板と資料を照合して選定</text><rect x="20" y="250" width="320" height="108" rx="10" fill="#fff"/><text x="36" y="292" font-size="23" font-weight="700">単相20kVA</text><text x="36" y="328" font-size="18">200V用 絶縁トランス</text><rect x="20" y="376" width="320" height="108" rx="10" fill="#fff"/><text x="36" y="418" font-size="23" font-weight="700">三相44kVA</text><text x="36" y="454" font-size="18">200V用 絶縁トランス</text><rect x="20" y="502" width="320" height="108" rx="10" fill="#fff"/><text x="36" y="544" font-size="23" font-weight="700">単相1.4kVA</text><text x="36" y="580" font-size="18">100V用 絶縁トランス</text><rect x="20" y="628" width="320" height="108" rx="10" fill="#fff"/><text x="36" y="670" font-size="23" font-weight="700">電源BOX（PDU）</text><text x="36" y="706" font-size="18">端子と定格に合う構成を選定</text><g font-size="18"><text x="24" y="780" font-weight="700">分岐・ケーブル・搬入出・運用</text><text x="24" y="810">まで、担当と手配範囲を整理。</text><text x="24" y="850">容量だけで接続方法や使える</text><text x="24" y="878">機材を判断しません。</text></g></g></svg>
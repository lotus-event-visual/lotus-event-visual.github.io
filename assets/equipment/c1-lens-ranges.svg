<svg xmlns="http://www.w3.org/2000/svg" width="360" height="665" viewBox="0 0 360 665" role="img" aria-labelledby="t d"><title id="t">C1レンズ6型式の投写比比較</title><desc id="d">WUXGA条件の投写比範囲を共通の目盛りで示す独自説明図です。実機写真や確定した設置寸法ではありません。</desc><rect width="360" height="665" rx="18" fill="#0c1827"/><g font-family="sans-serif" fill="#fff"><text x="22" y="36" font-size="22" font-weight="bold">投写比で比べる、6本のレンズ</text><text x="22" y="67" font-size="16" fill="#bfccd9">WUXGA条件｜同じ目盛りで比較</text><text x="22" y="110" font-size="18" font-weight="bold">ET-C1W300</text><text x="338" y="110" text-anchor="end" font-size="17">0.550–0.690:1</text><path d="M22 135H338" stroke="#36475a" stroke-width="4"/><path d="M46.83 135H53.15" stroke="#76dbc3" stroke-width="12" stroke-linecap="butt"/><text x="22" y="183" font-size="18" font-weight="bold">ET-C1W400</text><text x="338" y="183" text-anchor="end" font-size="17">0.680–0.950:1</text><path d="M22 208H338" stroke="#36475a" stroke-width="4"/><path d="M52.70 208H64.89" stroke="#76dbc3" stroke-width="12" stroke-linecap="butt"/><text x="22" y="256" font-size="18" font-weight="bold">ET-C1W500</text><text x="338" y="256" text-anchor="end" font-size="17">0.940–1.390:1</text><path d="M22 281H338" stroke="#36475a" stroke-width="4"/><path d="M64.43 281H84.75" stroke="#76dbc3" stroke-width="12" stroke-linecap="butt"/><text x="22" y="329" font-size="18" font-weight="bold">ET-C1S600</text><text x="338" y="329" text-anchor="end" font-size="17">1.360–2.100:1</text><path d="M22 354H338" stroke="#36475a" stroke-width="4"/><path d="M83.39 354H116.80" stroke="#76dbc3" stroke-width="12" stroke-linecap="butt"/><text x="22" y="402" font-size="18" font-weight="bold">ET-C1T700</text><text x="338" y="402" text-anchor="end" font-size="17">2.070–3.380:1</text><path d="M22 427H338" stroke="#36475a" stroke-width="4"/><path d="M115.45 427H174.58" stroke="#76dbc3" stroke-width="12" stroke-linecap="butt"/><text x="22" y="475" font-size="18" font-weight="bold">ET-C1T800</text><text x="338" y="475" text-anchor="end" font-size="17">3.300–6.600:1</text><path d="M22 500H338" stroke="#36475a" stroke-width="4"/><path d="M170.97 500H319.94" stroke="#76dbc3" stroke-width="12" stroke-linecap="butt"/><text x="22" y="559" font-size="15">0</text><text x="338" y="559" text-anchor="end" font-size="15">7:1</text><text x="22" y="594" font-size="16">投写比だけで設置位置は確定しません。</text><text x="22" y="623" font-size="14" fill="#bfccd9">独自の説明図。</text><text x="22" y="647" font-size="14" fill="#bfccd9">実機写真・設置寸法図ではありません。</text><path d="M46.83 126V144" stroke="#b9f6e7" stroke-width="1.5"/><path d="M53.15 126V144" stroke="#b9f6e7" stroke-width="1.5"/><path d="M52.70 199V217" stroke="#b9f6e7" stroke-width="1.5"/><path d="M64.89 199V217" stroke="#b9f6e7" stroke-width="1.5"/><path d="M64.43 272V290" stroke="#b9f6e7" stroke-width="1.5"/><path d="M84.75 272V290" stroke="#b9f6e7" stroke-width="1.5"/><path d="M83.39 345V363" stroke="#b9f6e7" stroke-width="1.5"/><path d="M116.80 345V363" stroke="#b9f6e7" stroke-width="1.5"/><path d="M115.45 418V436" stroke="#b9f6e7" stroke-width="1.5"/><path d="M174.58 418V436" stroke="#b9f6e7" stroke-width="1.5"/><path d="M170.97 491V509" stroke="#b9f6e7" stroke-width="1.5"/><path d="M319.94 491V509" stroke="#b9f6e7" stroke-width="1.5"/></g></svg>
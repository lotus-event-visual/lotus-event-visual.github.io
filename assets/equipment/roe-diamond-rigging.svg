<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="760" height="570" rx="18" fill="#091721"/><g font-family="sans-serif" fill="#ecf6fb"><text x="36" y="52" font-size="27">ROE Diamond 吊り・積み部材</text><text x="36" y="84" font-size="16" fill="#a9c0cf">DM2.6 を吊る・積むための純正部材</text><rect x="36" y="130" width="688" height="44" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="56" y="158" font-size="15" fill="#51d0c2">吊る</text><text x="250" y="158" font-size="16">吊り兼用ベースバー 500 / 1000mm + クランプ</text><rect x="36" y="184" width="688" height="44" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="56" y="212" font-size="15" fill="#51d0c2">吊りの上限</text><text x="250" y="212" font-size="16">屋内・純正部材で最大 20 枚</text><rect x="36" y="238" width="688" height="44" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="56" y="266" font-size="15" fill="#51d0c2">積む</text><text x="250" y="266" font-size="16">スタッキング(リアトラス 1000mm・ベース 910mm)</text><rect x="36" y="292" width="688" height="44" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="56" y="320" font-size="15" fill="#51d0c2">積みの上限</text><text x="250" y="320" font-size="16">屋内・純正部材・十分なバラストで最大 10 枚</text><rect x="36" y="346" width="688" height="44" rx="8" fill="#172d3c" stroke="#51d0c2"/><text x="56" y="374" font-size="15" fill="#51d0c2">つなぐ</text><text x="250" y="374" font-size="16">連結プレート(固定 2・4 方向/角度 -10〜+5°)</text><text x="36" y="430" font-size="15" fill="#a9c0cf">どちらも、パネルに登ることは禁止です。</text><text x="36" y="456" font-size="15" fill="#a9c0cf">部材名と数量は、手配時にメーカー資料と照合します。</text><text x="36" y="536" font-size="13" fill="#6f8796">出典：ROE Visual Diamond シリーズ資料(2026年11月9日照合)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650"><rect width="360" height="650" rx="20" fill="#f3f7fb"/><style>text{font-family:"Noto Sans CJK JP",sans-serif;fill:#193347;font-size:14px}.t{font-size:20px;font-weight:700}.s{font-size:12px}.b{fill:white;stroke:#b3c9d8;stroke-width:1.5}.a{fill:none;stroke:#147a9b;stroke-width:3}</style><text class="t" x="22" y="36">同じ映像を、2種類の形式へ</text><text x="22" y="61">Barco ImagePRO-II</text><rect x="22" y="81" width="316" height="44" rx="8" fill="#deedf4"/><text x="180" y="109" text-anchor="middle">Dual出力オプション搭載時の例</text><rect class="b" x="55" y="148" width="250" height="57" rx="10"/><text x="180" y="182" text-anchor="middle">選択した入力映像：1系統</text><path class="a" d="M180 205V234M174 226L180 234L186 226"/><rect x="45" y="240" width="270" height="65" rx="12" fill="#d3edf5"/><text x="180" y="268" text-anchor="middle">ImagePRO-II</text><text x="180" y="291" text-anchor="middle">同じ入力をA／Bで変換</text><path class="a" d="M180 305V326H95V349M180 326H265V349M89 341L95 349L101 341M259 341L265 349L271 341"/><rect class="b" x="22" y="356" width="146" height="87" rx="10"/><rect class="b" x="192" y="356" width="146" height="87" rx="10"/><text x="95" y="383" text-anchor="middle">出力A</text><text x="95" y="408" text-anchor="middle">表示先Aに合う</text><text x="95" y="430" text-anchor="middle">形式へ</text><text x="265" y="383" text-anchor="middle">出力B</text><text x="265" y="408" text-anchor="middle">表示先Bに合う</text><text x="265" y="430" text-anchor="middle">別の形式へ</text><text x="22" y="478" font-weight="700">別々の入力2系統を同時処理する図では</text><text x="22" y="501" font-weight="700">ありません。標準構成には当てはめません。</text><text x="22" y="535">手配前に搭載オプションを確認。</text><text x="22" y="558">本番前にA／Bの両方で映像を試験。</text><text x="22" y="581">必要な音声も送り先ごとに確認します。</text><text class="s" x="22" y="623">独自の説明図。実機写真・端子配置図ではありません。</text></svg>
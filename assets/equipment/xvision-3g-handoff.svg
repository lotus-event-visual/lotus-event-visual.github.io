<svg xmlns="http://www.w3.org/2000/svg" width="360" height="730" viewBox="0 0 360 730"><rect width="360" height="730" rx="18" fill="#f3f6f9"/><style>text{font-family:'Noto Sans CJK JP',sans-serif;fill:#18334a}.h{font-size:19px;font-weight:700}.t{font-size:14px}.s{font-size:12px}.n{font-size:16px;font-weight:700;fill:#087e8b}</style><text x="20" y="33" class="h">3G-SDI光伝送｜一組で手配</text><rect x="16" y="78" width="328" height="120" rx="12" fill="white"/><text x="30" y="105" class="n">1　送信と受信をそろえる</text><text x="30" y="135" class="t">送る側 TX：XVVSDI2FIBERT1</text><text x="30" y="161" class="t">受ける側 RX：XVVFIBER2SDIT1</text><text x="30" y="184" class="s">末尾-12G・Dualは別機種として扱います。</text><rect x="16" y="213" width="328" height="135" rx="12" fill="white"/><text x="30" y="241" class="n">2　光の方式と端子を合わせる</text><text x="30" y="271" class="t">完全な型式・光モジュール・SM/MM、</text><text x="30" y="297" class="t">端子・端面とケーブルを一組で照合。</text><text x="30" y="325" class="t">形が同じでも、適合するとは限りません。</text><rect x="16" y="363" width="328" height="141" rx="12" fill="#dff2f1"/><text x="30" y="391" class="n">3　受信側2出力＝同じ映像</text><text x="30" y="421" class="t">送り元 → TX → 光配線 → RX</text><text x="30" y="450" class="t">RXのSDI出力1・2へ、同じ映像を送ります。</text><text x="30" y="479" class="t">返し映像には、逆向きの別経路が必要です。</text><rect x="16" y="519" width="328" height="143" rx="12" fill="white"/><text x="30" y="547" class="n">4　敷設した経路で試験する</text><text x="30" y="578" class="t">担当者が光出力を止めてから接続。</text><text x="30" y="604" class="t">端面をのぞかず、実際の映像と音声を試験。</text><text x="30" y="630" class="t">受信側2出力を使うなら、両方の送り先で。</text><text x="20" y="693" class="s">途切れ・ノイズ・音声欠落があれば本番使用を止めます。</text><text x="20" y="714" class="s">伝送距離は機器・ケーブル・接続損失で変わります。</text></svg>